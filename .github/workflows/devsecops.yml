
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test application
        run: chmod +x mvnw && ./mvnw -B clean verify

      - name: Build Docker image
        run: docker build -t student-api:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        if: github.event_name == 'push'
        run: docker tag student-api:${{ github.sha }} 626672433528.dkr.ecr.ap-southeast-2.amazonaws.com/student-api:${{ github.sha }}

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        run: docker push 626672433528.dkr.ecr.ap-southeast-2.amazonaws.com/student-api:${{ github.sha }}
